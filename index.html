<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive Quiz System - Hệ thống Luyện tập & Kiểm tra Thích ứng</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- SweetAlert2 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dark-theme">

  <!-- HEADER HỆ THỐNG -->
  <header class="app-header">
    <div class="header-container">
      <div class="logo-area" id="brand-logo">
        <i data-lucide="brain-circuit" class="logo-icon"></i>
        <span class="logo-text">Adaptive<span class="highlight">Quiz</span></span>
      </div>

      <nav class="user-nav">
        <div id="nav-guest" class="nav-group">
          <button class="btn btn-outline" id="btn-nav-login">Đăng nhập</button>
          <button class="btn btn-primary" id="btn-nav-register">Đăng ký</button>
        </div>

        <div id="nav-user" class="nav-group hidden">
          <div class="user-profile-badge">
            <i data-lucide="user" class="avatar-icon"></i>
            <span id="user-fullname">Học viên</span>
            <span id="user-role-badge" class="badge badge-student">Student</span>
          </div>
          <button class="btn btn-icon-only" id="btn-logout" title="Đăng xuất">
            <i data-lucide="log-out"></i>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <!-- KHUNG CHỨA CÁC MÀN HÌNH VIEW CHÍNH -->
  <main class="app-main">
    <section id="view-auth" class="view-section"></section>
    <section id="view-list" class="view-section hidden"></section>
    <section id="view-quiz" class="view-section hidden"></section>
    <section id="view-result" class="view-section hidden"></section>
    <section id="view-admin" class="view-section hidden"></section>
  </main>

  <!-- KHUNG CHỨA CÁC MODAL / POPUP NỔI -->
  <div id="modals-holder"></div>

  <!-- CDN THƯ VIỆN BÊN NGOÀI -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <!-- MODULES JAVASCRIPT HỆ THỐNG -->
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/student-view.js"></script>
  <script src="js/admin/admin-core.js"></script>
  <script src="js/admin/admin-quizzes.js"></script>
  <script src="js/admin/admin-bank.js"></script>
  <script src="js/admin/admin-users.js"></script>
  <script src="js/admin/admin-reports.js"></script>
  <script src="js/admin/admin-tools.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
