<!-- ==========================================================================
   Adaptive Quiz System - View 1: Authentication Component (views/auth.html)
   Chứa form Đăng nhập và Form Đăng ký người dùng
   ========================================================================== -->

<div class="auth-card-container">
  <!-- Khung Đăng Nhập -->
  <div id="form-login-box" class="auth-box">
    <div class="auth-header">
      <h2>Đăng Nhập</h2>
      <p>Chào mừng bạn quay trở lại với Hệ thống Kiểm tra Thích ứng</p>
    </div>

    <!-- Form gửi dữ liệu đăng nhập -->
    <form id="form-login" class="auth-form">
      <!-- Ô nhập Tên đăng nhập -->
      <div class="form-group">
        <label for="login-username">Tên đăng nhập</label>
        <div class="input-icon-wrapper">
          <i data-lucide="user" class="input-icon"></i>
          <input type="text" id="login-username" placeholder="Nhập username" required>
        </div>
      </div>

      <!-- Ô nhập Mật khẩu -->
      <div class="form-group">
        <label for="login-password">Mật khẩu</label>
        <div class="input-icon-wrapper">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="login-password" placeholder="Nhập mật khẩu" required>
        </div>
      </div>

      <!-- Nút xác nhận Đăng nhập -->
      <button type="submit" class="btn btn-primary btn-block">Đăng Nhập</button>
    </form>

    <!-- Thẻ chuyển đổi hướng sang Form Đăng ký -->
    <div class="auth-footer">
      <p>Chưa có tài khoản? <a href="#" id="link-to-register">Đăng ký ngay</a></p>
    </div>
  </div>

  <!-- Khung Tạo Tài Khoản (Mặc định ẩn) -->
  <div id="form-register-box" class="auth-box hidden">
    <div class="auth-header">
      <h2>Tạo Tài Khoản</h2>
      <p>Bắt đầu hành trình củng cố kiến thức cùng AI</p>
    </div>

    <!-- Form gửi dữ liệu đăng ký -->
    <form id="form-register" class="auth-form">
      <!-- Ô nhập Họ và Tên -->
      <div class="form-group">
        <label for="reg-fullname">Họ và tên</label>
        <div class="input-icon-wrapper">
          <i data-lucide="smile" class="input-icon"></i>
          <input type="text" id="reg-fullname" placeholder="Nhập họ và tên" required>
        </div>
      </div>

      <!-- Ô nhập Username mới -->
      <div class="form-group">
        <label for="reg-username">Tên đăng nhập</label>
        <div class="input-icon-wrapper">
          <i data-lucide="user" class="input-icon"></i>
          <input type="text" id="reg-username" placeholder="Tạo username" required>
        </div>
      </div>

      <!-- Ô nhập Mật khẩu mới -->
      <div class="form-group">
        <label for="reg-password">Mật khẩu</label>
        <div class="input-icon-wrapper">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="reg-password" placeholder="Tạo mật khẩu" required>
        </div>
      </div>

      <!-- Nút xác nhận Đăng ký -->
      <button type="submit" class="btn btn-primary btn-block">Tạo Tài Khoản</button>
    </form>

    <!-- Thẻ chuyển đổi quay lại Form Đăng nhập -->
    <div class="auth-footer">
      <p>Đã có tài khoản? <a href="#" id="link-to-login">Đăng nhập</a></p>
    </div>
  </div>
</div>
