<!-- ==========================================================================
   Adaptive Quiz System - Admin Tab 2: Question Bank Component (views/admin/tabs/tab-bank.html)
   Giao diện hiển thị và quản lý toàn bộ Ngân hàng câu hỏi của hệ thống.
   ========================================================================== -->

<div id="tab-question-bank" class="admin-tab-content hidden" role="tabpanel" aria-labelledby="admin-tab-question-bank" aria-hidden="true" tabindex="0">
  <div class="question-card">
    <!-- Tiêu đề phần Ngân hàng câu hỏi & Nút Thêm Mới -->
    <div class="admin-card-heading-row">
      <h3 class="admin-card-heading">
        <i data-lucide="database"></i> Ngân Hàng Toàn Bộ Câu Hỏi
      </h3>

      <button id="btn-admin-add-global-question" class="btn btn-primary">
        <i data-lucide="plus-circle"></i> Thêm Câu Hỏi Mới
      </button>
    </div>

    <!-- Thanh công cụ tìm kiếm, lọc và sắp xếp (Control Bar) -->
    <div class="admin-filter-bar">
      <!-- Ô tìm kiếm theo nội dung câu hỏi -->
      <input type="text" id="search-global-bank" class="select-control" placeholder="Tìm nội dung câu hỏi..." aria-label="Tìm nội dung câu hỏi">
      
      <!-- Lọc theo Chủ đề -->
      <select id="filter-topic-global-bank" class="select-control" aria-label="Lọc câu hỏi theo chủ đề">
        <option value="ALL">Tất cả Chủ đề</option>
        <option value="Lập trình Web">Lập trình Web</option>
        <option value="Cơ sở dữ liệu">Cơ sở dữ liệu</option>
        <option value="Mạng máy tính">Mạng máy tính</option>
        <option value="Toán rời rạc">Toán rời rạc</option>
      </select>

      <!-- Lọc theo Độ khó -->
      <select id="filter-difficulty-global-bank" class="select-control" aria-label="Lọc câu hỏi theo độ khó">
        <option value="ALL">Tất cả Độ khó</option>
        <option value="Easy">Dễ (Easy)</option>
        <option value="Medium">Trung bình (Medium)</option>
        <option value="Hard">Khó (Hard)</option>
      </select>

      <!-- Sắp xếp danh sách câu hỏi -->
      <select id="sort-global-bank" class="select-control" aria-label="Sắp xếp ngân hàng câu hỏi">
        <option value="DATE_DESC" selected>Mới nhất trước</option>
        <option value="DATE_ASC">Cũ nhất trước</option>
        <option value="TITLE_ASC">Câu hỏi (A - Z)</option>
        <option value="TITLE_DESC">Câu hỏi (Z - A)</option>
      </select>

      <!-- Kích thước trang hiển thị -->
      <select id="pagesize-global-bank" class="select-control" aria-label="Số câu hỏi mỗi trang">
        <option value="10">10 / trang</option>
        <option value="20">20 / trang</option>
        <option value="50">50 / trang</option>
        <option value="ALL">Hiện tất cả</option>
      </select>
    </div>

    <!-- Bảng danh sách toàn bộ câu hỏi trong hệ thống -->
    <p class="admin-table-scroll-hint">Vuốt ngang để xem thêm cột trong bảng.</p>
    <div class="admin-table-wrap" role="region" aria-label="Bảng ngân hàng câu hỏi" tabindex="0">
      <table>
        <thead>
          <tr class="admin-table-header-row">
            <th scope="col">Chủ Đề</th>
            <th scope="col">Độ Khó</th>
            <th scope="col">Nội Dung Câu Hỏi</th>
            <th scope="col">Đáp Án Đúng</th>
            <th scope="col" class="admin-table-cell--center">Thao Tác</th>
          </tr>
        </thead>
        <tbody id="admin-global-questions-tbody"></tbody>
      </table>
    </div>

    <!-- Thanh phân trang cho Ngân hàng câu hỏi -->
    <nav id="pagination-global-bank" class="pagination-wrapper admin-table-pagination" aria-label="Phân trang ngân hàng câu hỏi"></nav>
  </div>
</div>
