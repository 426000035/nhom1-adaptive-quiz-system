<!-- ==========================================================================
   Adaptive Quiz System - Admin Tab 3: Users Management Component (views/admin/tab-users.html)
   Giao diện hiển thị danh sách tài khoản học viên, quản lý trạng thái và phân quyền.
   ========================================================================== -->

<div id="tab-users" class="admin-tab-content hidden">
  <div class="question-card">
    <!-- Tiêu đề phần Quản lý tài khoản -->
    <h3 style="display: flex; align-items: center; gap: 0.5rem; font-size: 1.15rem; margin-bottom: 1.25rem; color: var(--primary);">
      <i data-lucide="users"></i> Danh Sách Tài Khoản Học Viên & Phân Quyền
    </h3>

    <!-- Thanh công cụ tìm kiếm, lọc theo vai trò và phân trang (Control Bar) -->
    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem;">
      <!-- Ô tìm kiếm username hoặc họ tên -->
      <input type="text" id="search-admin-users" class="select-control" style="flex: 2; min-width: 200px;" placeholder="Tìm username hoặc họ tên...">
      
      <!-- Lọc theo Vai trò (Role) -->
      <select id="filter-role-admin-users" class="select-control" style="flex: 1; min-width: 130px;">
        <option value="ALL">Tất cả Role</option>
        <option value="admin">Admin</option>
        <option value="student">Student</option>
      </select>

      <!-- Sắp xếp họ tên -->
      <select id="sort-admin-users" class="select-control" style="flex: 1; min-width: 140px;">
        <option value="TITLE_ASC">Họ tên (A - Z)</option>
        <option value="TITLE_DESC">Họ tên (Z - A)</option>
      </select>

      <!-- Số lượng hiển thị trên 1 trang -->
      <select id="pagesize-admin-users" class="select-control" style="width: 110px;">
        <option value="10">10 / trang</option>
        <option value="20">20 / trang</option>
        <option value="50">50 / trang</option>
        <option value="ALL">Hiện tất cả</option>
      </select>
    </div>

    <!-- Bảng danh sách tài khoản người dùng -->
    <div style="overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
        <thead>
          <tr style="border-bottom: 2px solid var(--border-color); color: var(--primary);">
            <th style="padding: 0.75rem;">Username</th>
            <th style="padding: 0.75rem;">Họ và Tên</th>
            <th style="padding: 0.75rem;">Vai Trò (Role)</th>
            <th style="padding: 0.75rem;">Trạng Thái</th>
            <th style="padding: 0.75rem; text-align: center;">Thao Tác</th>
          </tr>
        </thead>
        <tbody id="admin-users-tbody"></tbody>
      </table>
    </div>

    <!-- Thanh phân trang danh sách tài khoản -->
    <div id="pagination-admin-users" class="pagination-wrapper" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem;"></div>
  </div>
</div>
