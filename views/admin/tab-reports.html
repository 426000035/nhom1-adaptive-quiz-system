<!-- ==========================================================================
   Adaptive Quiz System - Admin Tab 4: Reports & Statistics Component (views/admin/tab-reports.html)
   Giao diện hiển thị chỉ số tổng quan hệ thống và lịch sử nộp bài của học viên.
   ========================================================================== -->

<div id="tab-reports" class="admin-tab-content hidden">
  <!-- Các thẻ chỉ số thống kê tổng quan -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem;">
    <!-- Thẻ Tổng số lượt thi -->
    <div class="question-card" style="text-align: center;">
      <h4 style="color: var(--text-muted); font-size: 0.9rem;">Tổng Số Lượt Thi</h4>
      <p id="stat-total-attempts" class="score-huge" style="color: var(--primary); font-size: 2.5rem; margin: 0.5rem 0;">0</p>
    </div>

    <!-- Thẻ Điểm trung bình hệ thống -->
    <div class="question-card" style="text-align: center;">
      <h4 style="color: var(--text-muted); font-size: 0.9rem;">Điểm Trung Bình Hệ Thống</h4>
      <p id="stat-avg-score" class="score-huge" style="color: var(--success); font-size: 2.5rem; margin: 0.5rem 0;">0.0</p>
    </div>
  </div>

  <!-- Bảng Lịch sử Nộp bài của Học viên -->
  <div class="question-card">
    <!-- Tiêu đề phần Lịch sử -->
    <h3 style="display: flex; align-items: center; gap: 0.5rem; font-size: 1.15rem; margin-bottom: 1.25rem; color: var(--accent-ai);">
      <i data-lucide="history"></i> Lịch Sử Nộp Bài Của Học Viên
    </h3>

    <!-- Thanh công cụ tìm kiếm, lọc và phân trang (Control Bar) -->
    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem;">
      <!-- Ô tìm kiếm tên học viên hoặc tên bài thi -->
      <input type="text" id="search-admin-reports" class="select-control" style="flex: 2; min-width: 200px;" placeholder="Tìm tên học viên hoặc tên bài thi...">
      
      <!-- Sắp xếp danh sách -->
      <select id="sort-admin-reports" class="select-control" style="flex: 1; min-width: 140px;">
        <option value="TITLE_ASC">Học viên (A - Z)</option>
        <option value="TITLE_DESC">Học viên (Z - A)</option>
      </select>

      <!-- Kích thước trang hiển thị -->
      <select id="pagesize-admin-reports" class="select-control" style="width: 110px;">
        <option value="10">10 / trang</option>
        <option value="20">20 / trang</option>
        <option value="50">50 / trang</option>
        <option value="ALL">Hiện tất cả</option>
      </select>
    </div>

    <!-- Bảng hiển thị lịch sử nộp bài -->
    <div style="overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
        <thead>
          <tr style="border-bottom: 2px solid var(--border-color); color: var(--primary);">
            <th style="padding: 0.75rem;">Thời Gian</th>
            <th style="padding: 0.75rem;">Học Viên</th>
            <th style="padding: 0.75rem;">Tên Bài Thi</th>
            <th style="padding: 0.75rem;">Điểm Số</th>
            <th style="padding: 0.75rem;">Số Câu Đúng</th>
          </tr>
        </thead>
        <tbody id="admin-history-tbody"></tbody>
      </table>
    </div>

    <!-- Thanh phân trang cho báo cáo lịch sử -->
    <div id="pagination-admin-reports" class="pagination-wrapper" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem;"></div>
  </div>
</div>
