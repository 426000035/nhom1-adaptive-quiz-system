<!-- ==========================================================================
   Adaptive Quiz System - Admin Tab 1: Quizzes Management (views/admin/tab-quizzes.html)
   Chứa cài đặt Chủ đề (Topics), Độ khó (Difficulties) và Bảng danh sách bài thi.
   ========================================================================== -->

<div id="tab-quizzes" class="admin-tab-content">
  <!-- Cài đặt Topics & Difficulties -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
    <!-- Khung quản lý Topics -->
    <div class="question-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h4 style="display: flex; align-items: center; gap: 0.5rem; color: var(--primary);">
          <i data-lucide="layers"></i> Cài Đặt Chủ Đề (Topics)
        </h4>
        <button id="btn-admin-add-topic" class="btn btn-outline" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;">
          <i data-lucide="plus"></i> Thêm Chủ Đề
        </button>
      </div>
      <div id="admin-topics-list" style="display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
    </div>

    <!-- Khung quản lý Difficulties -->
    <div class="question-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h4 style="display: flex; align-items: center; gap: 0.5rem; color: var(--accent-ai);">
          <i data-lucide="bar-chart-2"></i> Cài Đặt Độ Khó (Difficulties)
        </h4>
        <button id="btn-admin-add-difficulty" class="btn btn-outline" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;">
          <i data-lucide="plus"></i> Thêm Độ Khó
        </button>
      </div>
      <div id="admin-difficulties-list" style="display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
    </div>
  </div>

  <!-- Bảng Danh sách Bài thi (Admin) -->
  <div class="question-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem;">
      <h3 style="display: flex; align-items: center; gap: 0.5rem; font-size: 1.15rem;">
        <i data-lucide="book-open"></i> Danh Sách Bài Thi
      </h3>
      <button id="btn-admin-create-quiz" class="btn btn-primary">
        <i data-lucide="plus-circle"></i> Tạo Đề Thi Mới
      </button>
    </div>

    <!-- Control Bar lọc bài thi -->
    <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem;">
      <!-- Ô tìm kiếm -->
      <input type="text" id="search-admin-quizzes" class="select-control" style="flex: 2; min-width: 200px;" placeholder="Tìm tên bài thi...">
      
      <!-- Lọc theo Chủ đề -->
      <select id="filter-topic-admin-quizzes" class="select-control" style="flex: 1; min-width: 130px;">
        <option value="ALL">Tất cả Chủ đề</option>
        <option value="Lập trình Web">Lập trình Web</option>
        <option value="Cơ sở dữ liệu">Cơ sở dữ liệu</option>
        <option value="Mạng máy tính">Mạng máy tính</option>
        <option value="Toán rời rạc">Toán rời rạc</option>
      </select>

      <!-- Lọc theo Độ khó (Mới bổ sung) -->
      <select id="filter-difficulty-admin-quizzes" class="select-control" style="flex: 1; min-width: 130px;">
        <option value="ALL">Tất cả Độ khó</option>
        <option value="Easy">Dễ (Easy)</option>
        <option value="Medium">Trung bình (Medium)</option>
        <option value="Hard">Khó (Hard)</option>
      </select>

      <!-- Sắp xếp -->
      <select id="sort-admin-quizzes" class="select-control" style="flex: 1; min-width: 140px;">
        <option value="TITLE_ASC">Tên đề (A - Z)</option>
        <option value="TITLE_DESC">Tên đề (Z - A)</option>
      </select>

      <!-- Phân trang -->
      <select id="pagesize-admin-quizzes" class="select-control" style="width: 110px;">
        <option value="10">10 / trang</option>
        <option value="20">20 / trang</option>
        <option value="50">50 / trang</option>
        <option value="ALL">Hiện tất cả</option>
      </select>
    </div>

    <!-- Bảng hiển thị dữ liệu bài thi -->
    <div style="overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem;">
        <thead>
          <tr style="border-bottom: 2px solid var(--border-color); color: var(--primary);">
            <th style="padding: 0.75rem;">Mã Đề</th>
            <th style="padding: 0.75rem;">Tên Bài Thi</th>
            <th style="padding: 0.75rem;">Chủ Đề</th>
            <th style="padding: 0.75rem;">Độ Khó</th>
            <th style="padding: 0.75rem;">Thời Gian</th>
            <th style="padding: 0.75rem;">Số Câu</th>
            <th style="padding: 0.75rem; text-align: center;">Thao Tác</th>
          </tr>
        </thead>
        <tbody id="admin-quizzes-tbody"></tbody>
      </table>
    </div>

    <!-- Phân trang danh sách bài thi -->
    <div id="pagination-admin-quizzes" class="pagination-wrapper" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem;"></div>
  </div>
</div>
