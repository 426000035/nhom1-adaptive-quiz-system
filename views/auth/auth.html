<div class="auth-card-container">
  <section class="auth-box" aria-labelledby="demo-signin-title">
    <div class="auth-header">
      <h1 id="demo-signin-title">Đăng nhập</h1>
    </div>
    <form id="form-demo-login">
      <div class="form-group">
        <label for="demo-username">Username</label>
        <input id="demo-username" class="select-control" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="form-group">
        <label for="demo-password">Mật khẩu</label>
        <input id="demo-password" class="select-control" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button id="btn-demo-login" class="btn btn-primary btn-block" type="submit">
        Đăng nhập
      </button>
    </form>
    <p id="demo-login-status" role="status" aria-live="polite">Đang tải tài khoản demo...</p>
  </section>
</div>
